[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "badcase-sdk"
version = "0.1.0"
description = "BadCase 指标采集 SDK - 采集 LLM 对话五大因素，输出 Prometheus 指标"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["badcase", "prometheus", "metrics", "llm", "observability"]
dependencies = ["prometheus-client>=0.19.0"]

[project.optional-dependencies]
fastapi = ["fastapi>=0.100.0"]
flask = ["flask>=2.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["badcase_sdk*"]
