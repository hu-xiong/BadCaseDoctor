<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 王者农场浇水计算器</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="header">
        <h1>个人中心</h1>
        <div class="header-links">
            <a th:href="@{/}" class="link-btn">返回首页</a>
            <a th:href="@{/logout}" class="link-btn">退出</a>
        </div>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div class="form-section">
        <h2>账号信息</h2>
        <div class="info-display">
            <div class="info-row">
                <span class="label">邮箱</span>
                <span class="value" th:text="${user.email}"></span>
            </div>
            <div class="info-row">
                <span class="label">注册时间</span>
                <span class="value" th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
            </div>
        </div>
    </div>

    <div class="form-section">
        <h2>绑定通知账号</h2>
        <p class="section-desc">绑定以下账号后，浇水提醒邮件中会附带这些信息，方便你登录游戏操作</p>
        <form th:action="@{/profile}" method="post" class="profile-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="qq">QQ号</label>
                    <input type="text" id="qq" name="qq" th:value="${user.qq}" placeholder="选填">
                </div>
                <div class="form-group">
                    <label for="wechat">微信号</label>
                    <input type="text" id="wechat" name="wechat" th:value="${user.wechat}" placeholder="选填">
                </div>
            </div>
            <div class="form-group" style="margin-top: 15px;">
                <label class="checkbox-label">
                    <input type="checkbox" name="emailNotify" value="true" th:checked="${user.emailNotify}">
                    启用邮件浇水提醒
                </label>
            </div>
            <button type="submit" class="btn-primary" style="margin-top: 20px;">保存设置</button>
        </form>
    </div>
</div>
</body>
</html>
