<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 王者农场浇水计算器</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-body">
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>王者农场</h1>
            <p>浇水计算器</p>
        </div>
        <div th:if="${param.error}" class="alert alert-error">
            邮箱或密码错误
        </div>
        <div th:if="${param.logout}" class="alert alert-info">
            您已退出登录
        </div>
        <div th:if="${param.registered}" class="alert alert-success">
            注册成功，请登录
        </div>
        <form th:action="@{/login}" method="post" class="auth-form">
            <div class="form-group">
                <label for="email">邮箱</label>
                <input type="email" id="email" name="username" required placeholder="请输入邮箱">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required placeholder="请输入密码">
            </div>
            <button type="submit" class="btn-primary">登 录</button>
        </form>
        <div class="auth-footer">
            还没有账号？<a th:href="@{/register}">立即注册</a>
        </div>
    </div>
</div>
</body>
</html>
