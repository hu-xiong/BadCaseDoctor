name: modify_bug
description: 修改 Bug 信息，包括状态、优先级、负责人等字段
trigger:
  intents: [修改，更新，编辑，改，调整，设为，改成，修正，变更]
  entities: [bug, 缺陷，问题，错误]
  patterns:
    - 修改 bug
    - 缺陷更新
    - 问题编辑
    - 调整 bug
    - 修改期望结果
    - 修改预期结果
    - 改复现步骤
    - 更新标题
    - 修改优先级
    - 修改状态
    - 把 bug 改成
    - 将缺陷

tools:
  - name: grep
    purpose: 定位目标 Bug
    params:
      keywords: ${user_keywords}
      target: bug
      mode: locate
      project_id: ${project_id}
  
  - name: modify
    purpose: 执行修改操作
    params:
      target: bug
      target_id: ${target_id}
      modifications: ${user_modifications}
      project_id: ${project_id}
      confirm: true

workflow:
  - step: 1
    tool: grep
    description: 使用 grep 工具搜索和定位目标 Bug
    depends_on: null
    
  - step: 2
    tool: modify
    description: 使用 modify 工具执行修改操作
    depends_on: step_1

examples:
  - 修改登录 Bug 的期望结果为希望能正常登录
  - 修改登录 Bug 的状态为已解决
  - 把优先级 P2 的 Bug 都改成 P1
  - 更新 Bug123 的描述信息
  - 修改登录相关的 Bug 状态
  - 将缺陷 123 分配给我的团队成员
  - 修改复现步骤为第一步打开页面

metadata:
  category: bug_management
  priority: high
  version: 1.1.0
  created_at: 2026-02-27
  last_updated: 2026-03-15
  author: BadCase Doctor Team
