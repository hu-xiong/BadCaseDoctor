name: modify_badcase
description: 修改 BadCase 信息，包括状态、优先级、解决方式等字段
trigger:
  intents: [修改, 更新, 调整, 修正, 变更]
  entities: [badcase, 问题用例, 错误用例, 测试用例]
  patterns:
    - 修改 badcase
    - 更新错误用例
    - 调整测试用例
    - badcase 编辑

tools:
  - name: grep
    purpose: 定位目标 BadCase
    params:
      target: badcase
      mode: locate
      keywords: ${user_keywords}
      project_id: ${project_id}
  
  - name: modify
    purpose: 执行修改操作
    params:
      target: badcase
      target_id: ${grep_result.first_badcase_id}
      modifications: ${user_modifications}
      project_id: ${project_id}
      confirm: false

workflow:
  - step: 1
    tool: grep
    description: 使用 grep 工具搜索和定位目标 BadCase
    depends_on: null
    
  - step: 2
    tool: modify
    description: 使用 modify 工具执行修改操作
    depends_on: step_1

examples:
  - 修改登录BadCase的状态为已解决
  - 更新问题用例123的解决方案
  - 将BadCase456分配给开发人员
  - 调整测试用例的优先级
  - 修正BadCase的描述信息
  - 问登录问题答的不好 复现步骤修改为提问登录问题即可

prompt_template: |
  你正在执行 **modify_badcase（修改 BadCase）** 技能。

  **工作流（必须按顺序，一轮一个工具）：**
  1. **grep**：target=badcase，keywords 用用户话里的标题/关键词或 record_id；须带 project_id
  2. **modify**：target=badcase，target_id 取 grep 的 first_badcase_id；字段写在 modifications 内；confirm=false 沙箱预览

  **规则：**
  - 首轮**只能 grep**，禁止跳过检索、禁止用界面 record_id 直接 modify
  - modifications 必须嵌套：`{"字段名": "新值"}`（如 reproduction_steps、status）
  - 不确定字段名或参数 → 先 get_tool_description("modify")

metadata:
  category: badcase_management
  priority: high
  version: 1.0.0
