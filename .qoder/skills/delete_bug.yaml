name: delete_bug
description: 删除 Bug 记录（须先定位再预览删除）
trigger:
  intents: [删除, 删掉, 移除, 去掉, 清除]
  entities: [bug, 缺陷, 问题, 错误]
  patterns:
    - 删除 bug
    - 删掉缺陷
    - 移除这个 bug

tools:
  - name: grep
    purpose: 定位要删除的 Bug
    params:
      target: bug
      mode: locate
      keywords: ${user_keywords}
      project_id: ${project_id}

  - name: delete
    purpose: 预览/确认删除
    params:
      target: bug
      target_id: ${grep_result.first_bug_id}
      project_id: ${project_id}
      confirm: false

workflow:
  - step: 1
    tool: grep
    description: grep 定位 Bug（target=bug 或 all）
    depends_on: null

  - step: 2
    tool: delete
    description: delete 预览（confirm=false）
    depends_on: step_1

examples:
  - 删除登录相关的 bug
  - 删掉缺陷 123

prompt_template: |
  你正在执行 **delete_bug** 技能：先 **grep** 定位，再 **delete** 预览（confirm=false）。
  首轮禁止直接 delete。参数见 get_tool_description。

metadata:
  category: bug_management
  priority: high
  version: 1.0.0
  created_at: 2026-05-29
  author: BadCaseDoctor Team
