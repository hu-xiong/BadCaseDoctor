name: delete_testcase
description: 删除测试用例（须先定位再预览删除）
trigger:
  intents: [删除, 删掉, 移除, 去掉, 清除]
  entities: [测试用例, testcase, test case, 用例]
  patterns:
    - 删除测试用例
    - 删掉用例
    - 移除测试用例

tools:
  - name: grep
    purpose: 定位测试用例
    params:
      target: testcase
      mode: locate
      keywords: ${user_keywords}
      project_id: ${project_id}

  - name: delete
    purpose: 预览删除
    params:
      target: testcase
      target_id: ${grep_result.first_testcase_id}
      project_id: ${project_id}
      confirm: false

workflow:
  - step: 1
    tool: grep
    description: grep 定位测试用例
    depends_on: null

  - step: 2
    tool: delete
    description: delete 预览（confirm=false）
    depends_on: step_1

examples:
  - 删除测试用例「登录成功」
  - 删掉用例 7

prompt_template: |
  你正在执行 **delete_testcase** 技能：grep → delete（confirm=false 预览）。
  首轮只能 grep。参数见 get_tool_description。

metadata:
  category: testcase_management
  priority: high
  version: 1.0.0
  created_at: 2026-05-29
  author: BadCaseDoctor Team
