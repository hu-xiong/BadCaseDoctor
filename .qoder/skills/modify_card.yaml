name: modify_card
description: 修改迭代卡片 Card 展示层信息（标题、描述等；改 Bug 状态等须 target=bug）
trigger:
  intents: [修改, 更新, 编辑, 调整, 改, 改成, 设为]
  entities: [card, 卡片, 迭代卡片]
  patterns:
    - 修改卡片
    - 更新卡片标题
    - 编辑卡片
    - 改卡片描述
    - 调整卡片

tools:
  - name: grep
    purpose: 定位 Card
    params:
      target: card
      mode: locate
      keywords: ${user_keywords}
      project_id: ${project_id}
      plan_id: ${plan_id}

  - name: modify
    purpose: 修改 Card 展示字段
    params:
      target: card
      target_id: ${grep_result.first_card_id}
      modifications: ${user_modifications}
      project_id: ${project_id}
      confirm: false

workflow:
  - step: 1
    tool: grep
    description: grep 定位 Card（target=card）
    depends_on: null

  - step: 2
    tool: modify
    description: modify 修改 Card 层字段（confirm=false）
    depends_on: step_1

examples:
  - 修改卡片标题为登录回归
  - 更新这张卡片的描述
  - 把迭代里「5月20日」那张卡片改个名字

prompt_template: |
  你正在执行 **modify_card** 技能。
  1. **grep** target=card 定位卡片
  2. **modify** target=card，target_id=first_card_id

  **注意：** 若用户要改 Bug 状态/复现步骤/严重程度等源表字段，须 **target=bug**（或 badcase/testcase），
  禁止用 target=card 改源表独有字段；可先 grep card 定位，再 modify target=bug + 对应 bug_id。

metadata:
  category: card_management
  priority: high
  version: 1.0.0
  created_at: 2026-07-04
  author: BadCase Doctor Team
