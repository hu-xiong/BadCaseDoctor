name: delete_card
description: 删除迭代卡片 Card（须先定位再预览删除）
trigger:
  intents: [删除, 删掉, 移除, 去掉, 清除]
  entities: [card, 卡片, 迭代卡片]
  patterns:
    - 删除卡片
    - 删掉这张卡片
    - 移除迭代卡片
    - 删除 card

tools:
  - name: grep
    purpose: 定位要删除的 Card
    params:
      target: card
      mode: locate
      keywords: ${user_keywords}
      project_id: ${project_id}
      plan_id: ${plan_id}

  - name: delete
    purpose: 预览/确认删除 Card
    params:
      target: card
      target_id: ${grep_result.first_card_id}
      project_id: ${project_id}
      confirm: false

workflow:
  - step: 1
    tool: grep
    description: grep 定位 Card（target=card）
    depends_on: null

  - step: 2
    tool: delete
    description: delete 预览删除 Card（confirm=false）
    depends_on: step_1

examples:
  - 删除标题为 5月20日 的卡片
  - 删掉这张迭代卡片

prompt_template: |
  你正在执行 **delete_card** 技能：先 **grep** 定位 Card，再 **delete** 预览（confirm=false）。
  **删 Card ≠ 删 Plan ≠ 删 Bug 源表**；target 必须是 card。
  用户要删迭代计划本身时用 delete_plan；要删 Bug/BadCase 源记录时用 delete_bug/delete_badcase。

metadata:
  category: card_management
  priority: high
  version: 1.0.0
  created_at: 2026-07-04
  author: BadCase Doctor Team
