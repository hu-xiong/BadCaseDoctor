# BadCaseDoctor 反向代理示例（HTTPS 终止在 nginx）
# 用法：复制到 /etc/nginx/sites-available/badcase-doctor 并 symlink，替换 server_name / 证书路径。

upstream badcase_web {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    client_max_body_size 64m;

    # 存活探针（勿强制鉴权）
    location = /health {
        proxy_pass http://badcase_web;
        proxy_set_header Host $host;
    }
    location = /ready {
        proxy_pass http://badcase_web;
        proxy_set_header Host $host;
    }

    # Agent / Chat SSE：关闭缓冲、拉长超时
    location ~ ^/api/(agent/|chat) {
        proxy_pass http://badcase_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://badcase_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}
