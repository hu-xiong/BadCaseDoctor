start_url: "http://localhost:5173"  # 待测试页面URL
wait_until: "networkidle"           # load | domcontentloaded | networkidle

# 可选：进入页面后执行的一系列动作（按顺序）
actions:
  - wait: 500                      # 等待 500ms
  - click: "text=登录"              # 点击包含文字的元素
  - wait_for_selector: "#username" # 等待输入框出现
  - fill:                          # 在输入框输入
      selector: "#username"
      value: "demo-user"
  - fill:
      selector: "#password"
      value: "demo-pass"
  - press:
      selector: "#password"
      press: "Enter"              # 回车提交
  - wait: 1500
  # 下载文件（两种方式：点击选择器 或 直接URL）
  - download: "a.download-report"   # 通过点击触发下载链接
    filename: "report.xlsx"
  - download: "https://example.com/image.png"  # 直接URL下载
    filename: "image.png"
  # 截图（整页或元素）
  - screenshot: true
    filename: "page.png"
    full_page: true
  - screenshot: true
    selector: "#chart"
    filename: "chart.png"

capture:
  url_include_patterns:
    - "/api/"                        # 正则或子串，留空表示捕获全部
  methods: [POST, GET, PUT, PATCH, DELETE]

